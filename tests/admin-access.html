<!doctype html><html lang="en"><meta charset="utf-8"><title>Kannika admin access checks</title><style>body{font:16px system-ui;padding:40px;background:#151715;color:#eeeade}button{padding:15px}li{margin:14px 0}</style><h1>Admin access checks</h1><p>Checks that a guest cannot obtain administrator access. No appointment is created.</p><button id="run">Run access checks</button><ol id="results"></ol><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import {initializeAuth,inMemoryPersistence,signInAnonymously} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
import {getFirestore,collection,getDocs,getDoc,doc,setDoc,updateDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore-lite.js';
import {firebaseConfig} from '../dist/firebase-config.js';
const app=initializeApp(firebaseConfig,'admin-access-check');const auth=initializeAuth(app,{persistence:inMemoryPersistence});const db=getFirestore(app);const results=document.querySelector('#results');
function log(text){const li=document.createElement('li');li.textContent=text;results.append(li)}
async function denied(label,fn){try{await fn();throw Error('Unexpectedly allowed: '+label)}catch(error){if(error.code==='permission-denied')log('PASS: '+label+' denied');else throw error}}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;try{await denied('unauthenticated booking list',()=>getDocs(collection(db,'bookings')));await signInAnonymously(auth);await denied('guest booking list',()=>getDocs(collection(db,'bookings')));await denied('guest administrator role read',()=>getDoc(doc(db,'admins',auth.currentUser.uid)));await denied('self-assigned administrator role',()=>setDoc(doc(db,'admins',auth.currentUser.uid),{role:'owner'}));await denied('guest booking confirmation',()=>updateDoc(doc(db,'bookings','b9e8edfa-b260-450e-afd0-24de1fc1d6d3'),{status:'confirmed',confirmedDate:'2026-11-01',confirmedTime:'15:00',updatedAt:serverTimestamp(),updatedBy:auth.currentUser.uid}));log('ALL ACCESS CHECKS PASSED')}catch(error){log('FAIL: '+error.code+' '+error.message)}};
</script></html>
